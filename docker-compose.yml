services:

  database-service:
    image: 'postgres'
    container_name: 'final-database-container'
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=final
    ports:
      - 2345:5432
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d postgres" ]
      interval: 5s
      timeout: 5s
      retries: 10

  backend-service:
    build: .
    container_name: 'final-backend-container'
    depends_on:
       test-database-service:
         condition: service_healthy
#       database-service:
#         condition: service_healthy
    environment:
#      - SPRING_DATASOURCE_URL=jdbc:postgresql://final-database-container:5432/final
      - SPRING_DATASOURCE_URL=jdbc:postgresql://final-test-database-container:5432/finalTest
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=postgres
      - SPRING_JPA_HIBERNATE_DDL_AUTO=none
      - SPRING_LIQUIBASE_CHANGE_LOG=classpath:db/changelog/db.changelog-master.xml
    ports:
      - 3333:9991

  test-database-service:
    image: 'postgres'
    container_name: 'final-test-database-container'
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=finalTest
    ports:
      - 4567:5432
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d finalTest" ]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 10s


